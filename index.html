<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <meta
      name="description"
      content="Turn text into weathered inscriptions and aged documents for printable tabletop RPG handouts."
    />
    <link rel="icon" type="image/svg+xml" href="/favicon.svg" />
    <title>Stele</title>
  </head>
  <body>
    <div class="app">
      <aside class="panel">
        <header class="brand">
          <h1>Stele</h1>
          <p>Inscriptions and documents for tabletop handouts</p>
        </header>
        <div id="controls"></div>
        <details class="diagnostics">
          <summary>Diagnostics</summary>
          <dl id="gpu-info" class="caps"></dl>
        </details>
      </aside>

      <main id="stage" class="stage">
        <canvas id="preview" role="img" aria-label="Preview of the handout"></canvas>
        <p id="stage-status" class="stage-status" role="status" hidden></p>
        <p id="stage-message" class="stage-message" role="alert" hidden></p>
      </main>
    </div>
    <div id="print-sheet" class="print-sheet"><img alt="" /></div>
    <noscript>Stele needs JavaScript to render.</noscript>
    <script type="module" src="/src/main.ts"></script>
  </body>
</html>
